name: Portable release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected canonical vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      publication:
        description: Keep draft for inspection or finalize after complete byte verification
        required: true
        default: draft
        type: choice
        options:
          - draft
          - finalize

# Explicit restricted tokens below; never rely on the host's default token.
permissions: {}
concurrency:
  group: away-release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.AWAY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      AWAY_RELEASE_HOST: ${{ vars.AWAY_RELEASE_HOST }}
      AWAY_SERVER_URL: ${{ vars.AWAY_SERVER_URL }}
      AWAY_API_URL: ${{ vars.AWAY_API_URL }}
      AWAY_UPLOAD_ORIGIN: ${{ vars.AWAY_UPLOAD_ORIGIN }}
      AWAY_REPOSITORY: ${{ vars.AWAY_REPOSITORY }}
      AWAY_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # No uses: actions/checkout (Forgejo must not default to a different code host).
      - name: Checkout exact configured repository and tag
        shell: bash
        env:
          AWAY_CHECKOUT_TOKEN: ${{ secrets.AWAY_CHECKOUT_TOKEN }}
          AWAY_CHECKOUT_USER: ${{ secrets.AWAY_CHECKOUT_USER }}
          AWAY_EVENT_SERVER: ${{ github.server_url }}
          AWAY_EVENT_REPO: ${{ github.repository }}
          AWAY_EVENT_NAME: ${{ github.event_name }}
          AWAY_EVENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          python3 - <<'PY'
          import base64, os, pathlib, re, subprocess, tempfile, urllib.parse
          env = os.environ
          server = env.get('AWAY_SERVER_URL', '').rstrip('/')
          u = urllib.parse.urlsplit(server)
          repo, tag = env.get('AWAY_REPOSITORY', ''), env.get('AWAY_TAG', '')
          if (u.scheme != 'https' or not u.hostname or u.username or u.password or u.path or u.query or u.fragment
              or '\\' in server or any(ord(c) < 33 for c in server)
              or not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo)
              or any(x in ('.', '..') for x in repo.split('/'))
              or server != env.get('AWAY_EVENT_SERVER', '').rstrip('/') or repo != env.get('AWAY_EVENT_REPO')
              or not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag)):
              raise SystemExit('Configured repository/host/tag does not match the authorized workflow event')
          token = env.get('AWAY_CHECKOUT_TOKEN', '')
          user = env.get('AWAY_CHECKOUT_USER', '')
          if not token or '\n' in token or '\r' in token or not re.fullmatch(r'[A-Za-z0-9_.-]+', user):
              raise SystemExit('Missing protected checkout credentials')
          source = pathlib.Path(tempfile.mkdtemp(prefix='away-source-', dir=env.get('RUNNER_TEMP')))
          # Credentials live only in this process environment, never the URL or git config.
          git_env = {**env, 'GIT_TERMINAL_PROMPT': '0', 'GIT_CONFIG_COUNT': '2',
                     'GIT_CONFIG_KEY_0': 'http.' + server + '/.extraHeader',
                     'GIT_CONFIG_VALUE_0': 'Authorization: Basic ' + base64.b64encode((user + ':' + token).encode()).decode(),
                     'GIT_CONFIG_KEY_1': 'http.followRedirects', 'GIT_CONFIG_VALUE_1': 'false'}
          def git(*args):
              return subprocess.run(['git', *args], cwd=source, env=git_env, check=True, capture_output=True, text=True).stdout.strip()
          try:
              git('init', '--quiet')
              git('remote', 'add', 'origin', server + '/' + repo + '.git')
              git('fetch', '--quiet', '--depth=1', 'origin', 'refs/tags/' + tag + ':refs/tags/' + tag)
              git('checkout', '--quiet', '--detach', 'refs/tags/' + tag)
              if env['AWAY_EVENT_NAME'] == 'push' and git('rev-parse', 'HEAD') != env['AWAY_EVENT_SHA']:
                  raise SystemExit('Tag source no longer matches the triggering commit')
          except subprocess.CalledProcessError:
              raise SystemExit('Authenticated checkout failed') from None
          with open(env['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('AWAY_SOURCE_DIR=' + str(source) + '\n')
          PY

      - name: Bootstrap pinned release toolchains
        shell: bash
        run: |
          set -eu
          cd "$AWAY_SOURCE_DIR"
          python3 tools/release/bootstrap.py --directory "$AWAY_SOURCE_DIR/toolchain" --environment "$AWAY_SOURCE_DIR/tool-environment.json"
          python3 - <<'PY'
          import json, os
          with open('tool-environment.json', encoding='utf-8') as f:
              values = json.load(f)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              for key, value in values.items():
                  if '\n' in value or '\r' in value:
                      raise SystemExit('Unsafe tool environment')
                  f.write(key + '=' + value + '\n')
          PY

      - name: Test exact publication and packaging sources
        shell: bash
        run: |
          set -eu
          cd "$AWAY_SOURCE_DIR"
          python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: Build complete signed release
        shell: bash
        env:
          AWAY_FIREBASE_CONFIG_B64: ${{ secrets.AWAY_FIREBASE_CONFIG_B64 }}
          AWAY_KEYSTORE_B64: ${{ secrets.AWAY_KEYSTORE_B64 }}
          AWAY_KEY_ALIAS: ${{ secrets.AWAY_KEY_ALIAS }}
          AWAY_STORE_PASSWORD: ${{ secrets.AWAY_STORE_PASSWORD }}
          AWAY_KEY_PASSWORD: ${{ secrets.AWAY_KEY_PASSWORD }}
          AWAY_SIGNING_SHA256: ${{ secrets.AWAY_SIGNING_SHA256 }}
        run: |
          set -eu
          cd "$AWAY_SOURCE_DIR"
          python3 tools/release/ci.py --environment tool-environment.json --tag "$AWAY_TAG" --out "$AWAY_SOURCE_DIR/release-assets"

      - name: Verify native relay metadata and non-root startup health
        shell: bash
        run: |
          set -eu
          cd "$AWAY_SOURCE_DIR"
          mkdir native-relay
          tar -xzf "release-assets/away-relay-$AWAY_TAG-linux-amd64.tar.gz" -C native-relay
          native-relay/away-relay --version
          python3 tools/release/smoke_relay.py --binary "$AWAY_SOURCE_DIR/native-relay/away-relay"

      - name: Upload draft and verify every remote byte
        shell: bash
        env:
          AWAY_RELEASE_TOKEN: ${{ secrets.AWAY_RELEASE_TOKEN }}
          AWAY_PUBLICATION: ${{ inputs.publication || 'finalize' }}
        run: |
          set -eu
          cd "$AWAY_SOURCE_DIR"
          if [ "$AWAY_PUBLICATION" = finalize ]; then
            python3 tools/release/publish.py release-assets --finalize
          else
            python3 tools/release/publish.py release-assets
          fi
