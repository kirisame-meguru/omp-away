# Include once inside the existing nginx `http` context; not a replacement
# for nginx.conf. Install only after provisioning this host's certificate.
map $http_upgrade $away_relay_connection {
    default close;
    ~*^websocket$ upgrade;
}
limit_req_zone $binary_remote_addr zone=away_handshakes:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=away_connections:1m;

server {
    listen 443 ssl;
    server_name away.example.invalid;
    ssl_certificate /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 8k;
    client_header_timeout 5s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    limit_req zone=away_handshakes burst=32 nodelay;
    limit_req_status 429;
    limit_conn away_connections 32;
    limit_conn_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz { proxy_pass http://127.0.0.1:8787; }
    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $away_relay_connection;
        proxy_set_header Host away.example.invalid;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 75s;
        proxy_send_timeout 20s;
    }
    location / { return 404; }
}
